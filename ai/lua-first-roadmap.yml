    title: Migrate core and bundled content and freeze covered legacy authoring
    status: in_progress
    depends_on: [static-domain-coverage]
    exit_criteria:
      - Targeted core and bundled content is Lua-authored with stable ids.
      - Migration tools emit native-object Lua skeletons and explicit TODOs.
      - New JSON/EOC features are frozen only in domains with complete replacements.
      - "Legacy author-interface removal is not gated on a release count or calendar window; once every checked inventory entry is mapped and the targeted content is migrated with stable ids, save migrations and copied-world tests cover the retained ids and the compatibility layer may be removed without bundled-content dependencies."
