$schema: lua-first-roadmap.schema.json
schema_version: 2
kind: lua_first_roadmap
direction_status: accepted
platform_version: 1
authority_path: data/lua/LUA_FIRST_PLATFORM.md
current_contract: ccb Platform v1
target: Lua is the sole executable authoring language for CCB core content and Mods through one Platform runtime, one ccb entrypoint, a typed content model and registrars, lifecycle-safe generic domain services, and explicit migration boundaries; passive schema-validatable JSON may remain in the same typed C++ content model, while EOC is removed only after its references reach zero. Runtime hardening, recommended standard helpers, internationalization, and cookbook/console/author experience remain independently tracked follow-on work.
current_phase: core_platform_complete

verification_policy:
  implementation_loop: source_and_test_writes_only
  acceptance_gate: one_final_gate_after_all_source_batches
  forbidden_before_gate:
    - cxx_build
    - catch2
    - python_suite
    - contract_generation
    - ledger_refresh
    - full_corpus_audit
  verified_requires: final_semantic_gate_with_native_and_real_corpus_evidence
  bounded_means: named_real_shapes_are_supported_without_claiming_selector_or_domain_completeness
  complete_means: the declared core Platform source scope is closed and the final gate passed; independent follow-on capabilities, zero migration TODOs, and whole-corpus content migration are not required

corpus_sources:
  - id: json-object-types
    path: data/reference/json/ccb_json_object_types.json
    selector: type
    role: real_json_inventory
  - id: eoc-conditions
    path: data/reference/json/ccb_eoc_conditions.json
    selector: key
    role: real_eoc_inventory
  - id: eoc-effects
    path: data/reference/json/ccb_eoc_effects.json
    selector: key
    role: real_eoc_inventory

status_definitions:
  milestone: [planned, in_progress, source_complete_unverified, pending_generation, complete, blocked]
  capability: [planned, in_progress, source_complete_unverified, pending_generation, complete, blocked, not_applicable]
  verification: [not_run, pending_generation, pending_final_gate, passed]

milestones:
  - id: unique-runtime-and-naming
    title: One Platform runtime and lua_platform source naming
    status: complete
    depends_on: []
    scope: Lifecycle, namespace, first-party file names, and disabled-build routing use cata::lua_platform and lua_platform_*.
    exit_criteria:
      - Normal lifecycle calls create and address only Platform state.
      - First-party source, tests, and build routes contain no historical Platform filename.
      - Per-Mod Lua states remain instances of the same Platform runtime; no second public contract or compatibility namespace is introduced.
    evidence:
      - path: src/lua_platform_loader.cpp
        kind: source
      - path: src/lua_platform_runtime.cpp
        kind: source
      - path: src/lua_platform_state.cpp
        kind: source
      - path: tests/lua_platform_test.cpp
        kind: test_source
    verification: passed

  - id: unique-contract-and-assets
    title: One ccb contract and Platform-only data assets
    status: complete
    depends_on: [unique-runtime-and-naming]
    scope: require("ccb"), Platform LuaLS declarations, root main.lua authoring, and explicit Platform schemas.
    exit_criteria:
      - The only public Lua module is ccb and it creates no global game table.
      - Every Mod state uses that same Platform contract; isolation does not create a second behaviour system.
      - Templates and bundled examples require no lua directory or authored manifest.
      - Passive JSON is accepted only as schema-validatable data entering the typed C++ content model.
      - Removed runtime-only declarations and assets are not recreated.
    evidence:
      - path: src/lua_platform_loader.cpp
        kind: source
      - path: data/lua/types/ccb_platform_v1.d.lua
        kind: declaration
      - path: data/lua/templates
        kind: documentation
      - path: data/mods/Lua_First_Example
        kind: source
      - path: data/lua/reference/ccb_platform_api_v1.schema.json
        kind: schema
    verification: passed

  - id: platform-contract-tools
    title: Platform native inventory, contract, and synchronization tools
    status: complete
    depends_on: [unique-contract-and-assets]
    scope: Platform-only generators, checkers, schemas, tests, and routing.
    exit_criteria:
      - Native inventory discovery uses workspace lua_platform_* files and stable filesystem rules.
      - Public contract generation joins Platform LuaLS, native registration, native inventory, and explicit schema only.
      - Coverage reports synchronization, not JSON/EOC parity or a historical percentage.
    evidence:
      - path: tools/lua_api/generate_platform_native_inventory.py
        kind: source
      - path: tools/lua_api/generate_platform_contract.py
        kind: source
      - path: tools/lua_api/generate_platform_coverage.py
        kind: source
      - path: tools/lua_api/test_generate_platform_coverage.py
        kind: test_source
      - path: ai/test-matrix.yml
        kind: source
    verification: passed

  - id: authority-and-routing-docs
    title: Current architecture, workflow, and contributor routing
    status: complete
    depends_on: [platform-contract-tools]
    scope: Architecture specification, EOC workflow, agent instructions, contributor guidance, and generated-report source rules for the sole Platform.
    exit_criteria:
      - Documents describe the one Platform runtime and ccb entrypoint without date-based progress claims or a second Lua contract.
      - Source paths and commands use current lua_platform_* and Platform tool names.
      - Passive schema-validatable JSON, retained legacy parser/runner boundaries, and the four migration TODO categories are explicit.
      - The PR endpoint is core Platform infrastructure and generic capability closure; follow-on hardening, standard helpers, internationalization, and author experience are not merge gates.
      - Generated registry, ledger, and migration reports are refreshed only at the final gate.
    evidence:
      - path: data/lua/LUA_FIRST_PLATFORM.md
        kind: documentation
      - path: data/lua/LUA_FIRST_EOC_WORKFLOW.md
        kind: documentation
      - path: AGENTS.md
        kind: documentation
      - path: CONTRIBUTING.md
        kind: documentation
      - path: data/lua/AGENTS.md
        kind: documentation
    verification: passed

  - id: native-hooks-and-identity
    title: Native hooks, handles, identity, and lifecycle safety
    status: complete
    depends_on: [unique-runtime-and-naming]
    scope: Hook payloads, callback boundaries, generation-safe handles, world/runtime identity, and shutdown behavior.
    exit_criteria:
      - Every retained hook entry has a direct Platform registration and bounded payload contract.
      - Handles reject stale owner, runtime, and world identity before native access.
      - Source and regression-test coverage exists for each closed domain slice.
    evidence:
      - path: src/lua_platform_hooks.cpp
        kind: source
      - path: src/lua_platform_handle.cpp
        kind: source
      - path: src/lua_platform_state.cpp
        kind: source
      - path: data/lua/types/ccb_platform_v1.d.lua
        kind: declaration
      - path: tests/lua_platform_test.cpp
        kind: test_source
    verification: passed

  - id: complex-content-registrar
    title: Transactional complex content registrar
    status: complete
    depends_on: [unique-contract-and-assets, native-hooks-and-identity]
    scope: Typed Lua-native builders and registrars for inheritance, extend/delete, reference order, finalize, rollback, and native definition ownership; passive JSON may share the typed C++ model but is not a Lua API.
    exit_criteria:
      - A registrar exposes pure-Lua typed builders rather than JSON-loader-shaped or raw JSON pass-through author APIs.
      - Reference ordering, finalize retention, and rollback are explicit and deterministic.
      - Unsupported shapes become classified migration TODOs instead of hidden compatibility calls.
    evidence:
      - path: src/lua_platform_content.h
        kind: source
      - path: src/lua_platform_world_content.cpp
        kind: source
      - path: src/lua_platform_registry.cpp
        kind: source
      - path: tools/migrate_lua_first.py
        kind: source
      - path: tests/lua_platform_test.cpp
        kind: test_source
    verification: passed

  - id: eoc-capability-domains
    title: Domain-shaped executable capability closure
    status: complete
    depends_on: [native-hooks-and-identity, complex-content-registrar]
    scope: Character, inventory, map, NPC/creature, vehicle, mission, weather, task, dialogue, and presentation workflows expressed through the sole Platform; this closes reusable capabilities, not every legacy selector.
    exit_criteria:
      - Each domain batch has native services, LuaLS declarations, migration shapes, and test source.
      - Bounded support names the real shapes it accepts and leaves other shapes as TODOs.
      - No EOC-key-shaped runner, legacy object, or hidden compatibility call is introduced as a shortcut; the existing runner remains private for core and old Mods until its references are zero.
    evidence:
      - path: data/lua/LUA_FIRST_EOC_WORKFLOW.md
        kind: documentation
      - path: src/lua_platform_*.cpp
        kind: source
      - path: data/lua/types/ccb_platform_v1.d.lua
        kind: declaration
      - path: tools/migrate_lua_first.py
        kind: source
      - path: tests/lua_platform_test.cpp
        kind: test_source
    verification: passed

  - id: migration-disposition-policy
    title: Explicit migration disposition and TODO policy
    status: complete
    depends_on: [platform-contract-tools, eoc-capability-domains]
    scope: Real JSON/EOC inventories, migration output, replacement ledger, and four-category TODO evidence.
    exit_criteria:
      - Every inventory entry has one honest disposition and explicit evidence, with TODOs classified as auto_fix, manual_rewrite, platform_gap, or semantic_choice.
      - Primitive and bounded statuses never imply selector or domain completeness.
      - Only platform_gap dispositions drive Platform core work; TODO totals are not a completion metric.
      - TODOs remain boundary records rather than completion records; a disposition may stay open for a later capability or author decision.
      - Verified status is emitted only after the final semantic gate, and remaining TODOs may stay open for later batches.
    evidence:
      - path: tools/agent/generate_lua_first_replacement_ledger.py
        kind: source
      - path: ai/lua-first-replacement-ledger.schema.json
        kind: schema
      - path: tools/agent/test_lua_first_replacement_ledger.py
        kind: test_source
      - path: tools/migrate_lua_first.py
        kind: source
      - path: data/reference/json/ccb_eoc_conditions.json
        kind: real_inventory
    verification: passed

  - id: platform-capability-closure
    title: Core Platform infrastructure and generic capability closure
    status: complete
    depends_on: [authority-and-routing-docs, migration-disposition-policy, eoc-capability-domains]
    scope: Close the Platform v1 runtime and ccb contract, typed content model and registrars, lifecycle and handle/identity safety, reusable generic domain services, and honest migration boundaries needed by PR 664.
    exit_criteria:
      - The sole Platform v1 runtime and ccb entrypoint expose typed native builders and generic domain services with source, declaration, test, and documentation evidence.
      - Typed registrars provide deterministic reference ordering, finalize/rollback ownership, and no raw JSON or hidden compatibility loader.
      - Lifecycle and handle/identity boundaries reject stale owner, runtime, world, and transaction access.
      - Passive schema-validatable JSON may remain in the same typed C++ content model; no all-content migration is required for this milestone.
      - New executable content uses Lua, while the existing JSON parser and EOC runner remain private compatibility paths for core and old Mods.
      - Remaining shapes are classified TODOs and do not block unrelated bounded capabilities; TODO totals are not used as completion evidence.
    evidence:
      - path: src/lua_platform_loader.cpp
        kind: source
      - path: src/lua_platform_content.h
        kind: source
      - path: src/lua_platform_runtime.cpp
        kind: source
      - path: data/lua/types/ccb_platform_v1.d.lua
        kind: declaration
      - path: tests/lua_platform_test.cpp
        kind: test_source
      - path: data/lua/LUA_FIRST_PLATFORM.md
        kind: documentation
    verification: passed

  - id: legacy-retirement-boundary
    title: Deferred legacy retirement and EOC runner removal gate
    status: planned
    depends_on: [platform-capability-closure]
    scope: Optional selected content migrations and eventual retirement of executable legacy EOC support after its real consumers disappear; passive schema-validatable JSON is not targeted for deletion.
    exit_criteria:
      - Any selected core or bundled migration preserves stable ids and save compatibility, but no corpus-wide migration target is imposed.
      - The C++ EOC runner is removed only after the real inventory and reference audit prove zero EOC references across core and old Mods.
      - The JSON parser may continue to serve passive or engine-owned JSON and is not treated as a Platform completion blocker.
      - Retained legacy paths stay private and receive no new Platform dependencies while this gate is open.
    evidence:
      - path: src/json_loader.cpp
        kind: source
      - path: src/effect_on_condition.cpp
        kind: source
      - path: data/reference/json/ccb_eoc_conditions.json
        kind: real_inventory
      - path: data/reference/json/ccb_eoc_effects.json
        kind: real_inventory
      - path: tools/migrate_lua_first.py
        kind: source
    verification: pending_final_gate

  - id: final-acceptance-gate
    title: One-time core Platform capability acceptance gate
    status: complete
    depends_on: [authority-and-routing-docs, migration-disposition-policy, platform-capability-closure]
    scope: Generate Platform references, run contract/tool checks, build once, run the broad Platform suite, and classify the real JSON/EOC corpus once for the declared core Platform scope.
    exit_criteria:
      - Platform native inventory, public contract, and synchronization coverage are generated from current sources.
      - All applicable Platform tools and tests agree with the generated references.
      - One low-memory build, one broad Platform Catch2 run, and one real corpus classification have recorded results.
      - Only after those results pass may the declared core Platform infrastructure and generic capability scope be marked complete; independent follow-on capabilities, zero TODOs, and whole-corpus content migration are not acceptance conditions.
    evidence:
      - path: ai/test-matrix.yml
        kind: source
      - path: tools/lua_api/check_platform_native_inventory.py
        kind: source
      - path: tools/lua_api/check_platform_contract.py
        kind: source
      - path: tools/lua_api/check_platform_coverage.py
        kind: source
      - path: data/lua/reference/ccb_platform_native_inventory.json
        kind: generated_output
        state: current
    verification: passed

