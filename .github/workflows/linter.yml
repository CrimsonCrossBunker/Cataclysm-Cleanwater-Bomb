name: Code Style Reviewer

on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize', 'ready_for_review']
    paths:
      - 'Makefile'
      - '.astylerc'
      - '.github/workflows/linter.yml'
      - '**.json'
      - '**.cpp'
      - '**.h'
      - '**.c'
      - '!src/third-party/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  style-code:
    if: ${{ github.event.pull_request.draft == false }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: '${{ github.event.pull_request.head.sha }}'
        persist-credentials: false

    - name: determine changed files
      id: changed-files
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      with:
        script: |
          var fs = require('fs');
          const response = await github.paginate(github.rest.pulls.listFiles,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            }
          );
          const files = response.map(x => x.filename);
          for (const path of files) {
            console.log(path);
          }
          const workflowPath = '.github/workflows/linter.yml';
          const hasWorkflowChange = files.includes(workflowPath);
          const hasCpp = hasWorkflowChange || files.some(path =>
            !path.startsWith('src/third-party/') &&
            (path === 'Makefile' || path === '.astylerc' || path.endsWith('.c') ||
              path.endsWith('.cpp') || path.endsWith('.h'))
          );
          const hasJson = hasWorkflowChange || files.some(path => path.endsWith('.json'));
          core.setOutput('has_cpp', hasCpp ? 'true' : 'false');
          core.setOutput('has_json', hasJson ? 'true' : 'false');
          fs.writeFileSync("files_changed", files.map(path => `${path}\0`).join(''));

    - name: install astyle
      if: ${{ steps.changed-files.outputs.has_cpp == 'true' }}
      run: sudo apt-get install astyle

    - name: run astyle
      if: ${{ steps.changed-files.outputs.has_cpp == 'true' }}
      run: make -k astyle-fast

    - name: run JSON formatter
      if: ${{ steps.changed-files.outputs.has_json == 'true' }}
      run: make -k style-all-json-parallel

    - name: check formatting
      shell: bash
      run: |
        status=0
        while IFS= read -r -d '' path; do
          if [[ -e "$path" ]] && ! git diff --quiet -- "$path"; then
            printf 'Formatting changes required: %q\n' "$path"
            status=1
          fi
        done < files_changed
        exit "$status"

    - name: Create pr comment artifacts
      if: ${{ failure() }}
      shell: bash
      run: |
        : > formatter_suggestions.diff
        while IFS= read -r -d '' path; do
          if [[ -e "$path" ]]; then
            git diff -U1 -- "$path" >> formatter_suggestions.diff
          fi
        done < files_changed
        if [[ -s formatter_suggestions.diff ]]; then
          mkdir -p suggestions
          mv formatter_suggestions.diff suggestions/diff.txt
          echo ${{ github.event.pull_request.number }} > suggestions/pr_number
          echo ${{ github.event.pull_request.head.sha }} > suggestions/commit_sha
          echo '[JSON & C++ formatters](https://github.com/CleverRaven/Cataclysm-DDA/blob/master/doc/c++/DEVELOPER_TOOLING.md)' > suggestions/comment.txt
        fi
    - name: Upload pr comment artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: suggestions
        path: suggestions/
