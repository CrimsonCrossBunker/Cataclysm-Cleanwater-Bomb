name: Agent context and documentation impact

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-context-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-agent-context:
    name: Agent context and documentation impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned metadata dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/agent/requirements.txt

      - name: Validate metadata and migration inventory
        run: |
          python3 tools/agent/generate_markdown_inventory.py --check
          python3 tools/agent/benchmark_context_pack.py --check
          python3 tools/agent/build_context_pack.py \
            --task-id repository-navigation \
            --file AGENTS.md \
            --token-limit 2000 \
            --output /tmp/ccb-context-pack.json
          python3 tools/agent/check_project_metadata.py
          python3 -m unittest discover -s tools/agent -p 'test_*.py'

      - name: Validate generated JSON and EOC contracts
        run: |
          python3 tools/json_api/generate_contracts.py --check
          python3 -m unittest discover -s tools/json_api -p 'test_*.py'

      - name: Report documentation impact and validate PR responsibility
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/agent/check_docs_impact.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --check-pr-body

      - name: Validate staged impact configuration outside pull requests
        if: github.event_name != 'pull_request'
        run: >-
          python3 tools/agent/check_docs_impact.py
          --changed-file ai/docs-impact.yml
