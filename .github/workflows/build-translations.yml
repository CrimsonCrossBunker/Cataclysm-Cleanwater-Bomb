name: Build translations
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TX_TOKEN:
        required: false

jobs:
  build-translations:

    runs-on: ubuntu-22.04
    # Leave enough time for a full pull followed by targeted retries. This is
    # a safety cap only; the higher worker count keeps normal runs much shorter.
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    env:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}
    steps:
      - name: Install gettext
        if: ${{ env.TX_TOKEN != '' }}
        run: sudo apt-get install gettext

      - name: Install Transifex CLI
        if: ${{ env.TX_TOKEN != '' }}
        run: |
          curl -sL https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz | sudo tar zxvf - -C /usr/bin tx

      - name: Checkout local repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: |
            .tx
            tools
            lang
            src/lang_stats.inc
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Pull translations
        if: ${{ env.TX_TOKEN != '' }}
        shell: bash
        run: |
          log="$RUNNER_TEMP/tx-pull.log"
          attempted="$RUNNER_TEMP/tx-attempted-languages"
          completed="$RUNNER_TEMP/tx-completed-languages"
          failed="$RUNNER_TEMP/tx-failed-languages"

          # The Transifex HTTP/2 connection may be closed after roughly one
          # hour. Use the CLI's default concurrency to finish sooner, let it
          # continue past individual failures, then retry only the languages
          # that started but did not finish using a fresh connection.
          pull_status=0
          tx pull -a --force --skip -w 5 2>&1 | tee "$log" || pull_status=$?

          sed -nE 's/.*\[([^][]+)\] - .*/\1/p' "$log" |
            sort -u > "$attempted"
          sed -nE 's/.*\[([^][]+)\] - Done[[:space:]]*$/\1/p' "$log" |
            sort -u > "$completed"
          comm -23 "$attempted" "$completed" > "$failed"

          if [ ! -s "$failed" ]; then
            exit "$pull_status"
          fi

          retry_failed=0
          while IFS= read -r language; do
            recovered=false
            for attempt in 1 2 3; do
              echo "::warning::Retrying Transifex language $language (attempt $attempt/3)"
              if timeout 5m tx pull -l "$language" --force -w 1; then
                recovered=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$recovered" != true ]; then
              echo "::error::Failed to pull Transifex language $language after 3 retries"
              retry_failed=1
            fi
          done < "$failed"
          exit "$retry_failed"

      - name: Reuse available translations from trusted master builds
        if: ${{ env.TX_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Translation jobs can succeed while another platform is still
          # building or has failed. Look for usable artifacts, rather than
          # requiring the entire parent build to have succeeded.
          run_ids="$(
            for workflow in matrix.yml release.yml; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch master --event push --limit 20 \
                --json databaseId --jq '.[].databaseId'
            done | sort -nr -u
          )"
          artifact_dir="$RUNNER_TEMP/master-translations"
          for run_id in $run_ids; do
            artifact_id="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name == "translations" and .expired == false) | .id')"
            if [ -z "$artifact_id" ]; then
              continue
            fi
            candidate_dir="$artifact_dir/$run_id"
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name translations --dir "$candidate_dir"; then
              if [ -d "$candidate_dir/lang/po" ] && \
                [ -d "$candidate_dir/lang/mo" ] && \
                [ -s "$candidate_dir/src/lang_stats.inc" ]; then
                echo "::notice::TX_TOKEN unavailable; using translations from trusted master run $run_id"
                cp -a "$candidate_dir/." .
                exit 0
              fi
            fi
            echo "::warning::Translation artifact from master run $run_id is unavailable or incomplete"
          done
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::No trusted translation artifact is available; building this pull request with an empty translation catalog"
            mkdir -p lang/po lang/mo/placeholder/LC_MESSAGES
            cat > lang/po/placeholder.po <<'EOF'
          msgid ""
          msgstr ""
          "Content-Type: text/plain; charset=UTF-8\n"
          "Plural-Forms: nplurals=2; plural=(n != 1);\n"
          EOF
            python3 - <<'PY'
          import struct
          from pathlib import Path

          path = Path("lang/mo/placeholder/LC_MESSAGES/cataclysm-dda.mo")
          path.write_bytes(struct.pack("<7I", 0x950412de, 0, 0, 28, 28, 0, 0))
          PY
            exit 0
          fi
          echo "::error::No downloadable translation artifact is available from recent trusted master builds"
          exit 1

      - name: Validate and discard invalid translations
        if: ${{ env.TX_TOKEN != '' }}
        run: ./lang/discard_invalid_po.sh

      - name: Update translation statistics
        if: ${{ env.TX_TOKEN != '' }}
        run: ./lang/update_stats.sh

      - name: Compile translations
        if: ${{ env.TX_TOKEN != '' }}
        run: ./lang/compile_mo.sh all

      - name: Store translation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "translations"
          path: |
            lang/po
            lang/mo
            src/lang_stats.inc
          if-no-files-found: error
