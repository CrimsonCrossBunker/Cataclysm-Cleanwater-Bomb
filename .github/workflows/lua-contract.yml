name: Lua public contract

on:
  pull_request:
    paths:
      - '.github/workflows/lua-contract.yml'
      - 'ai/docs-impact.yml'
      - 'ai/generated-files.yml'
      - 'ai/test-matrix.yml'
      - 'data/lua/**'
      - 'src/catalua*.cpp'
      - 'src/catalua*.h'
      - 'src/event.h'
      - 'tools/lua_api/**'
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/lua-contract.yml'
      - 'ai/docs-impact.yml'
      - 'ai/generated-files.yml'
      - 'ai/test-matrix.yml'
      - 'data/lua/**'
      - 'src/catalua*.cpp'
      - 'src/catalua*.h'
      - 'src/event.h'
      - 'tools/lua_api/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lua-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends lua5.4
          python3 -m pip install --disable-pip-version-check -r tools/lua_api/requirements.txt

      - name: Validate Lua v5 declarations and generated contract
        run: |
          python3 tools/lua_api/check_luals_declarations.py
          python3 tools/lua_api/check_ccb_inventory.py
          python3 tools/lua_api/generate_public_contract.py --check
          python3 tools/lua_api/check_public_contract.py
          python3 tools/lua_api/check_examples.py --require-luac
          python3 -m unittest discover -s tools/lua_api -p 'test_*.py'
