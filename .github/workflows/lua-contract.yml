name: Lua public contract

on:
  pull_request:
    paths:
      - '.github/workflows/lua-contract.yml'
      - 'ai/docs-impact.yml'
      - 'ai/generated-files.yml'
      - 'ai/test-matrix.yml'
      - 'data/lua/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'tests/CMakeLists.txt'
      - 'tests/Makefile'
      - 'tests/test_support_sources.txt'
      - 'src/CMakeLists.txt'
      - 'src/lua/CMakeLists.txt'
      - 'src/init.cpp'
      - 'src/main.cpp'
      - 'src/sol/config.hpp'
      - 'src/lua_platform*.cpp'
      - 'src/lua_platform*.h'
      - 'src/event.h'
      - 'tools/lua_api/**'
      - 'tools/create_lua_mod.py'
      - 'tools/test_create_lua_mod.py'
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/lua-contract.yml'
      - 'ai/docs-impact.yml'
      - 'ai/generated-files.yml'
      - 'ai/test-matrix.yml'
      - 'data/lua/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'tests/CMakeLists.txt'
      - 'tests/Makefile'
      - 'tests/test_support_sources.txt'
      - 'src/CMakeLists.txt'
      - 'src/lua/CMakeLists.txt'
      - 'src/init.cpp'
      - 'src/main.cpp'
      - 'src/sol/config.hpp'
      - 'src/lua_platform*.cpp'
      - 'src/lua_platform*.h'
      - 'src/event.h'
      - 'tools/lua_api/**'
      - 'tools/create_lua_mod.py'
      - 'tools/test_create_lua_mod.py'
  workflow_dispatch:
    inputs:
      native_test_filter:
        description: Optional Catch2 filter for one native Lua batch; empty runs contract checks
        required: false
        type: string
        default: ''
      native_test_suite:
        description: Compile Lua tests only, or the full native test suite
        required: true
        type: choice
        options: [lua, all]
        default: lua

permissions:
  contents: read

concurrency:
  group: lua-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.native_test_filter == '' }}
    name: Lua public contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned validation dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/lua_api/requirements.txt

      - name: Install pinned Lua language server
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz \
            -o "${RUNNER_TEMP}/ccb-luals.tar.gz"
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  ${RUNNER_TEMP}/ccb-luals.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/ccb-luals"
          tar -xzf "${RUNNER_TEMP}/ccb-luals.tar.gz" -C "${RUNNER_TEMP}/ccb-luals"

      - name: Validate Lua contracts and editor diagnostics once
        # Includes the five contract gates, negative cases and real LuaLS diagnostics.
        env:
          CCB_LUALS: ${{ runner.temp }}/ccb-luals/bin/lua-language-server
        run: python3 -m unittest discover -s tools/lua_api -p 'test_*.py'

      - name: Validate Mod scaffolds
        run: python3 tools/test_create_lua_mod.py

  native-acceptance:
    name: Native Lua batch acceptance
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.native_test_filter != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NATIVE_TEST_FILTER: ${{ inputs.native_test_filter }}
      CATA_TEST_SUITE: ${{ inputs.native_test_suite }}
      CCACHE_DIR: ${{ github.workspace }}/.ci-native-ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libncursesw5-dev gettext cmake ninja-build ccache

      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: lua-native-gcc14-v1-${{ github.sha }}
          restore-keys: lua-native-gcc14-v1-

      - name: Configure native Lua tests
        run: |
          cmake -S . -B .ci-lua-native -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_BUILD_TYPE=Release \
            '-DCMAKE_CXX_FLAGS_RELEASE=-O0 -DNDEBUG' \
            -DCURSES=ON -DTILES=OFF -DSOUND=OFF -DLOCALIZE=OFF \
            -DUSE_PREFIX_DATA_DIR=OFF -DUSE_HOME_DIR=OFF \
            -DTESTS=ON -DBUILD_TESTING=ON -DCATA_ENABLE_LUA_PLATFORM=ON \
            -DCATA_TEST_SUITE="$CATA_TEST_SUITE"

      - name: Build native test binary
        run: cmake --build .ci-lua-native --target cata_test --parallel 1

      - name: Save compiler cache independently of test results
        if: ${{ always() && !cancelled() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Run requested native batch
        run: |
          ./.ci-lua-native/tests/cata_test "$NATIVE_TEST_FILTER" \
            --rng-seed 4902 --order lex --error-format=github-action \
            --warn NoTests \
            --user-dir="${RUNNER_TEMP}/ccb-native-test-user"
