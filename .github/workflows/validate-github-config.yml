name: GitHub configuration validation

on:
  pull_request:
    paths:
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - 'OWNERSHIP.md'
      - 'REPOSITORY_SETTINGS.md'
      - 'ai/repository-settings.target.*'
      - 'tools/agent/audit_repository_governance.py'
      - 'tools/agent/test_repository_governance.py'
  push:
    branches:
      - master
    paths:
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - 'OWNERSHIP.md'
      - 'REPOSITORY_SETTINGS.md'
      - 'ai/repository-settings.target.*'
      - 'tools/agent/audit_repository_governance.py'
      - 'tools/agent/test_repository_governance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml-syntax:
    name: YAML syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse GitHub YAML files
        run: |
          git ls-files -z -- \
            ':(glob).github/**/*.yml' ':(glob).github/**/*.yaml' \
            | xargs -0 ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path); puts "OK #{path}" }'
      - name: Install pinned governance dependencies
        run: python3 -m pip install --disable-pip-version-check -r tools/agent/requirements.txt
      - name: Audit repository governance target
        run: python3 tools/agent/audit_repository_governance.py --check
