name: Stage 5 macOS co-op runtime validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the universal co-op dylib
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both Rust targets through the release Make recipe
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          make NATIVE=osx UNIVERSAL_BINARY=1 RUST_COOP=1 TILES=0 RUST_COOP_JOBS=3 coop-runtime
          lipo -info libccb_bevy_ecs_coop.dylib
          lipo libccb_bevy_ecs_coop.dylib -verify_arch x86_64 arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage5-macos-universal-coop
          path: libccb_bevy_ecs_coop.dylib
          if-no-files-found: error
          retention-days: 3

  loopback:
    name: Native ABI and Renet loopback (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage5-macos-universal-coop
      - name: Load packaged library and complete a native loopback connection
        run: python3 .github/stage5-coop-runtime-probe.py libccb_bevy_ecs_coop.dylib ${{ matrix.arch }}
