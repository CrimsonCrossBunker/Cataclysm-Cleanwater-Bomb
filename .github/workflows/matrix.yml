name: General build matrix

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the broad C++ test suites after compiling the matrix
        required: false
        type: boolean
        default: true

permissions:
  actions: read
  contents: read

# We only care about the latest revision of a PR, so cancel all previous instances.
# Allow running master builds to complete to help with ccache refreshes.
concurrency:
  group: general-build-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Overall strategy for what sorts of builds to include:
# We want a build for the newest and oldest supported version of each compiler.
# We want a build for each platform.
# We also want to ensure that each of the following tweaks are covered in at
# least one PR build:
# - TILES=1
# - SOUND=1
# - RELEASE=1
# - CMAKE=1
# - LOCALIZE=0
# - LTO=1 (to catch ODR violations)
# - LIBBACKTRACE=1 (on Linux and Windows)
# - Broad tests with important mods enabled on explicit workflow dispatch
# - A clang-tidy run
# - SANITIZE=address,undefined
# We try to minimize the number of builds subject to those constraints.
#
# To see what toolchains are available, the following may be useful:
# https://launchpad.net/%7Eubuntu-toolchain-r/+archive/ubuntu/test/+index
# https://apt.llvm.org/
# For github provided runners: https://github.com/actions/runner-images
# See also our publicized docs about compiler support: https://github.com/CleverRaven/Cataclysm-DDA/blob/master/doc/c++/COMPILER_SUPPORT.md
#
# At the time of writing (June 2025), the feature matrix for the above criteria looks like this:
# | name                                 | OS       | compiler | newest/ oldest | tiles | sound | localize | cmake | backtrace | lto | sanitize | mods |
# | ------------------------------------ | -------- | -------- | -------------- | ----- | ----- | -------- | ----- | --------- | --- | -------- | ---- |
# | Basic Build                          | ubuntu   | clang-13 | oldest (clang) |       |       | yes      |       |           |     |          | yes  |
# | Clang 18, Ubuntu, Tiles, ASan        | ubuntu   | clang-18 | newest (clang) | yes   |       | yes      |       | yes       |     | address  |      |
# | GCC 9, Curses, LTO                   | ubuntu   | gcc-9    | oldest   (gcc) |       |       | yes      |       | yes       | yes |          |      |
# | GCC 14, Ubuntu, Curses               | ubuntu   | gcc-14   | newest   (gcc) |       |       | yes      |       |           |     |          |      |
# | GCC 9, Ubuntu, Tiles, Sound, CMake   | ubuntu   | gcc-9    | oldest   (gcc) | yes   | yes   |          | yes   |           |     |          |      |
# | macOS 15, Apple Clang 17             | macOS 15 | apple clang-17  |  N/A    | yes   | yes   | yes      |       |           |     |          |      |
# | Windows (in msvc-full-features.yml)  | windows  | msvc     |     N/A        | yes   | yes   | yes      |       | yes?      |     |          |      |

jobs:
  skip-duplicates-code:
    continue-on-error: true
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip_code: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # master
        with:
          skip_after_successful_duplicate: 'false'
          paths_ignore: '["doc/**", "doxygen_doc/**", "lgtm/**", "msvc-**", "tools/**", "utilities/**", "data/**", "lang/**"]'
  skip-duplicates-data:
    continue-on-error: true
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip_data: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # master
        with:
          skip_after_successful_duplicate: 'false'
          paths_ignore: '["android/**", "build-data/osx/**", "doc/**", "doxygen_doc/**", "lgtm/**", "msvc-**", "tools/**", "utilities/**"]'
  matrix-variables:
    permissions:
      contents: none
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      fail_fast: ${{ steps.matrix_vars.outputs.fail_fast }}
      skip_tests: ${{ steps.matrix_vars.outputs.skip_tests }}
      max_parallel: ${{ steps.matrix_vars.outputs.max_parallel }}
    steps:
      - id: matrix_vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_TESTS: ${{ inputs.run_tests || false }}
        run: |
          echo "fail_fast=$([ "$GITHUB_REF_NAME" = "master" -o "$GITHUB_REPOSITORY_OWNER" != "CleverRaven" ] && echo false || echo true)" >> $GITHUB_OUTPUT
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$RUN_TESTS" = "true" ]; then
            echo "skip_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip_tests=true" >> "$GITHUB_OUTPUT"
          fi
          echo "max_parallel=$([ "$GITHUB_REF_NAME" = "master" -o "$GITHUB_REPOSITORY_OWNER" != "CleverRaven" ] && echo 20 || echo 1)" >> $GITHUB_OUTPUT
  build-translations:
    needs: [ skip-duplicates-code, skip-duplicates-data ]
    if: ${{ github.event_name != 'pull_request' || (needs.skip-duplicates-code.outputs.should_skip_code != 'true' || needs.skip-duplicates-data.outputs.should_skip_data != 'true') }}
    uses: ./.github/workflows/build-translations.yml
    permissions:
      actions: read
      contents: read
    secrets:
      TX_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TX_TOKEN || '' }}
  compile-shaders:
    name: Compile shaders
    needs: [ skip-duplicates-code, skip-duplicates-data ]
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (needs.skip-duplicates-code.outputs.should_skip_code != 'true' || needs.skip-duplicates-data.outputs.should_skip_data != 'true')) }}
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: build SDL3 shader artifacts
      uses: ./.github/actions/build-sdl3-shaders

  varied_builds:
    needs: [ skip-duplicates-code, skip-duplicates-data, matrix-variables, build-translations, compile-shaders ]
    if: ${{ always() && (needs.compile-shaders.result == 'success' || needs.compile-shaders.result == 'skipped') && needs.matrix-variables.result == 'success' && needs.build-translations.result == 'success' }}
    strategy:
      fail-fast: ${{ fromJSON(needs.matrix-variables.outputs.fail_fast) }}
      max-parallel: ${{ fromJSON(needs.matrix-variables.outputs.max_parallel) }}
      matrix:
        include:
          - compiler: clang++-13
            os: ubuntu-22.04
            tiles: 0
            sound: 0
            cmake: 0
            localize: 1
            test-stage: 1
            native: linux64
            pch: 1
            lua_platform: 1
            pr_artifact: linux-curses
            dont_skip_data_only_changes: 1
            mods: --mods=magiclysm
            title: Basic Build (Clang oldest supported, Ubuntu, Curses)
            ccache_limit: 4.5G
            ccache_key: linux-llvm-13

          - compiler: clang++
            os: macos-15
            cmake: 0
            native: osx
            pch: 0
            tiles: 1
            sound: 1
            sdl3: 0
            localize: 1
            lua_platform: 1
            title: macOS 15, Apple Clang 17, Tiles, Sound, SDL2
            ccache_limit: 12G
            ccache_key: macos-llvm-17-sdl2

          - title: Android arm64-v8a (build only)
            os: ubuntu-latest
            android: arm64
            lua_platform: 1
            sdl3: 1 # Android remains on SDL3.

          - compiler: g++-9
            os: ubuntu-24.04
            cmake: 0
            tiles: 0
            sound: 0
            localize: 1
            gold: 1
            lto: 1
            libbacktrace: 1
            # Keep LTO/ODR coverage independent from the exceptionally large
            # sol2 runtime TU.  Lua remains enabled in Make, CMake, Android,
            # macOS, and Windows builds elsewhere in this matrix.
            lua_platform: 0
            native: linux64
            pch: 1
            cxxflags: -gsplit-dwarf
            title: GCC 9, Curses, LTO (Lua disabled)
            ccache_limit: 7.5G
            ccache_key: linux-gcc-9-lto
            extra_package: g++-9

          - compiler: clang++-18
            os: ubuntu-24.04
            cmake: 0
            tiles: 1
            sound: 0
            sdl3: 0
            localize: 1
            lua_platform: 1
            native: linux64
            pch: 1
            sanitize: address
            dont_skip_data_only_changes: 1
            title: Clang 18, Ubuntu, Tiles, ASan
            ccache_limit: 6G
            ccache_key: linux-llvm-18-asan

          - compiler: g++-14
            os: ubuntu-latest
            cmake: 0
            tiles: 0
            sound: 0
            localize: 1
            dont_skip_data_only_changes: 1
            lua_platform: 1
            native: linux64
            num_build_jobs: 2
            pch: 1
            title: GCC 14, Ubuntu, Curses, Lua API
            ccache_limit: 6.5G
            ccache_key: linux-gcc-14

          - compiler: g++-9
            os: ubuntu-24.04
            cmake: 1
            tiles: 1
            sound: 1
            sdl3: 0
            localize: 0
            lua_platform: 1
            native: linux64
            num_build_jobs: 2
            sanitize: undefined
            pch: 1
            title: GCC 9, Ubuntu, Tiles, Sound, CMake
            ccache_limit: 1G
            ccache_key: linux-gcc-9-cmake
            extra_package: g++-9

    name: ${{ matrix.title }}
    runs-on: ${{ matrix.os }}
    env:
        ZSTD_CLEVEL: 17
        CMAKE: ${{ matrix.cmake }}
        COMPILER: ${{ matrix.compiler }}
        MXE_TARGET: ${{ matrix.mxe_target }}
        WINE: ${{ matrix.wine }}
        ANDROID: ${{ matrix.android }}
        OS: ${{ matrix.os }}
        TILES: ${{ matrix.tiles }}
        SOUND: ${{ matrix.sound }}
        SDL3: ${{ matrix.sdl3 }}
        LOCALIZE: ${{ matrix.localize }}
        CATA_ENABLE_LUA_PLATFORM: ${{ matrix.lua_platform }}
        MODS: ${{ matrix.mods }}
        SANITIZE: ${{ matrix.sanitize }}
        TEST_STAGE: ${{ matrix.test-stage }}
        CXXFLAGS: ${{ matrix.cxxflags }}
        LDFLAGS: ${{ matrix.ldflags }}
        EXTRA_TEST_OPTS: --error-format=github-action
        NUM_TEST_JOBS: ${{ matrix.num_test_jobs }}
        NUM_BUILD_JOBS: ${{ matrix.num_build_jobs }}
        NATIVE: ${{ matrix.native }}
        PCH: ${{ matrix.pch }}
        GOLD: ${{ matrix.gold }}
        LTO: ${{ matrix.lto }}
        LIBBACKTRACE: ${{ matrix.libbacktrace }}
        RELEASE: 1
        CCACHE_LIMIT: ${{ matrix.ccache_limit }}
        CCACHE_FILECLONE: true
        CCACHE_HARDLINK: true
        CCACHE_NOCOMPRESS: true
        SKIP: >-
          ${{
          ( github.event.pull_request.draft == true && matrix.title != 'Basic Build and Test (Clang oldest supported, Ubuntu, Curses)' ) ||
          ( matrix.dont_skip_data_only_changes == 0 && needs.skip-duplicates-code.outputs.should_skip_code == 'true' ) ||
          ( matrix.dont_skip_data_only_changes != 0 && needs.skip-duplicates-data.outputs.should_skip_data == 'true' )
          }}
        SKIP_TESTS: ${{ fromJSON(needs.matrix-variables.outputs.skip_tests) || (matrix.android != '') }}
    steps:
    - name: Maximize build space (ubuntu)
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' }}
      uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
      with:
        remove-android: ${{ matrix.android == '' }}
    - name: Maximize build space (mac)
      if: ${{ env.SKIP == 'false' && runner.os == 'macos' && matrix.android == '' }}
      run: |
        sudo rm -rf $ANDROID_HOME
    - name: checkout repository
      if: ${{ env.SKIP == 'false' }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: download prebuilt shader artifacts
      if: ${{ env.SKIP == 'false' && ((matrix.tiles == 1 && matrix.sdl3 == 1) || matrix.android != '') }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: cdda-shaders
        path: data/shaders
    - name: mark shader artifacts fresh
      if: ${{ env.SKIP == 'false' && ((matrix.tiles == 1 && matrix.sdl3 == 1) || matrix.android != '') }}
      run: |
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
    - name: install dependencies (ubuntu)
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' }}
      run: |
          sudo apt-get update
          sudo apt-get install libncursesw5-dev ccache gettext parallel ${{ matrix.extra_package }}
          sudo locale-gen en_US.UTF-8 de_DE.UTF-8
    - name: install SDL2 dependencies (ubuntu)
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' && matrix.tiles == 1 && matrix.sdl3 != 1 && matrix.android == '' }}
      run: |
          sudo apt-get install libflac-dev libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev libsdl2-mixer-dev libpulse-dev
    - name: setup SDL3 stack (ubuntu)
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' && matrix.tiles == 1 && matrix.sdl3 == 1 }}
      uses: ./.github/actions/setup-sdl3-stack
      with:
        cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
        prefix: ${{ runner.workspace }}/sdl3_prefix
    - name: install recent ccache on ubuntu
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' }}
      run: |
          ccache --version
          sudo apt-get remove --purge -y ccache
          curl -sL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz | sudo tar Jxvf - --strip-components 1 -C /usr/bin ccache-4.10.2-linux-x86_64/ccache
          ccache --version
    - name: install build dependencies (mac)
      if: ${{ env.SKIP == 'false' && runner.os == 'macOS' }}
      run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache parallel
    - name: install PR dmgdist dependencies (mac)
      if: ${{ env.SKIP == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 != 1 }}
      continue-on-error: true
      run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
    - name: install SDL2 frameworks (mac)
      if: ${{ env.SKIP == 'false' && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 != 1 }}
      uses: BrettDong/setup-sdl2-frameworks@a8ca795ef904417e9ddcb010ef6bf2d11779dbe3 # v2
      with:
        sdl2: 2.30.11
        sdl2-ttf: 2.24.0
        sdl2-image: 2.8.4
        sdl2-mixer: 2.8.0
    - name: install macports (mac, SDL2)
      if: ${{ env.SKIP == 'false' && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 != 1 }}
      uses: melusina-org/setup-macports@c7eb59386def259a274627092566a7f7b8d219b1 # v1
    - name: install macports packages (mac, SDL2)
      if: ${{ env.SKIP == 'false' && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 != 1 }}
      run: |
        sudo port install freetype +universal pkgconfig +universal
    - name: install SDL3 dependencies (mac)
      if: ${{ env.SKIP == 'false' && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 == 1 }}
      run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes \
              brew install pkgconf sdl3 sdl3_image sdl3_ttf sdl3_mixer
    - name: prepare
      if: ${{ env.SKIP == 'false' }}
      run: bash ./build-scripts/requirements.sh
    - name: Fetch translations artifact into build
      if: ${{ env.SKIP == 'false' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: translations
    - name: Get ccache vars
      id: get-vars
      if: ${{ env.SKIP == 'false' }}
      run: |
        echo "datetime=$(/bin/date -u "+%Y%m%d%H%M")" >> $GITHUB_OUTPUT
        echo "datetime-seconds=$(/bin/date +%s)" >> $GITHUB_OUTPUT
        echo "ccache-path=$([ "$RUNNER_OS" = "macOS" ] && echo '/Users/runner/Library/Caches/ccache' || echo '~/.cache/ccache')" >> $GITHUB_OUTPUT
      shell: bash
    - name: ccache cache files
      if: ${{ env.SKIP == 'false' && ( runner.os == 'Linux' || runner.os == 'macOS' ) && matrix.ccache_key != '' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.get-vars.outputs.ccache-path }}
        # double-dash after compiler is not a typo, it is to disambiguate between g++-<date> and g++-11-<date> for restore key prefix matching
        key: ccache-${{ github.ref_name }}-${{ matrix.ccache_key }}--${{ steps.get-vars.outputs.datetime }}
        restore-keys: |
          ccache-master-${{ matrix.ccache_key }}--
    - uses: ammaraskar/gcc-problem-matcher@0f9c86f9e693db67dacf53986e1674de5f2e5f28 # master

    - name: Set up JDK (android)
      if: ${{ env.SKIP == 'false' && runner.os == 'Linux' && matrix.android != '' }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build CDDA
      if: ${{ env.SKIP == 'false' }}
      run: bash ./build-scripts/gha_compile_only.sh
    - name: post-build ccache manipulation
      if: ${{ env.SKIP == 'false' && !failure() && (runner.os == 'Linux' || runner.os == 'macOS') && matrix.ccache_key != '' }}
      run: |
        ccache --show-stats --verbose
        NOW=`/bin/date +%s`
        DELTA=$(( $NOW - ${{ steps.get-vars.outputs.datetime-seconds }} ))
        ccache --evict-older-than ${DELTA}s
        ccache --show-stats --verbose
        ccache -M ${{ env.CCACHE_LIMIT }}
        ccache -c
        ccache --show-stats --verbose
    - name: clear ccache on PRs
      if: ${{ github.ref_name != 'master' && env.SKIP == 'false' && !failure() && (runner.os == 'Linux' || runner.os == 'macOS') }}
      run: |
        ccache -C
    # TODO: post ccache here, however actions/cache@v2 does not support manual upload step
    - name: run tests
      if: ${{ env.SKIP == 'false' && env.SKIP_TESTS == 'false' }}
      run: bash ./build-scripts/gha_test_only.sh
    - name: upload artifacts if failed
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: failure()
      with:
        name: cata_test
        path: tests/cata_test*
        if-no-files-found: ignore
        retention-days: 9
    - name: package PR Linux curses artifact
      id: package-pr-linux-curses
      if: ${{ env.SKIP == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && runner.os == 'Linux' && matrix.pr_artifact == 'linux-curses' && success() }}
      continue-on-error: true
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: |
        set -eo pipefail
        make CCACHE=1 CROSS="${CROSS_COMPILATION:-}" LINTJSON=0 DEBUG_SYMBOLS=1 LANGUAGES=all bindist
        cp -- cataclysmdda-0.J.tar.gz "ccb-pr-linux-curses-${PR_NUMBER}.tar.gz"
    - name: upload PR Linux curses artifact
      id: upload-pr-linux-curses
      if: ${{ steps.package-pr-linux-curses.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccb-pr-linux-curses-pr-${{ github.event.pull_request.number }}
        path: ccb-pr-linux-curses-${{ github.event.pull_request.number }}.tar.gz
        if-no-files-found: error
        retention-days: 14
    - name: package PR macOS tiles artifact
      id: package-pr-macos-tiles
      if: ${{ env.SKIP == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && runner.os == 'macOS' && matrix.tiles == 1 && matrix.sdl3 != 1 && success() }}
      continue-on-error: true
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: |
        set -eo pipefail
        make -j3 CCACHE=1 LINTJSON=0 DEBUG_SYMBOLS=1 NATIVE=osx TILES=1 SOUND=1 SDL3=0 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 PCH=0 FRAMEWORK=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=0 dmgdist
        cp -- Cataclysm.dmg "ccb-pr-macos-tiles-${PR_NUMBER}.dmg"
    - name: upload PR macOS tiles artifact
      id: upload-pr-macos-tiles
      if: ${{ steps.package-pr-macos-tiles.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccb-pr-macos-tiles-pr-${{ github.event.pull_request.number }}
        path: ccb-pr-macos-tiles-${{ github.event.pull_request.number }}.dmg
        if-no-files-found: error
        retention-days: 14
    - name: package PR Android arm64-v8a artifact
      id: package-pr-android-arm64-v8a
      if: ${{ env.SKIP == 'false' && github.event_name == 'pull_request' && github.event.pull_request.draft == false && runner.os == 'Linux' && matrix.android == 'arm64' && success() }}
      continue-on-error: true
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: |
        set -eo pipefail
        apk_dir=android/app/build/outputs/apk/experimental/release
        mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print)
        if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Android arm64-v8a APK in $apk_dir, found ${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
        fi
        cp -- "${apks[0]}" "ccb-pr-android-arm64-v8a-${PR_NUMBER}.apk"
    - name: upload PR Android arm64-v8a artifact
      id: upload-pr-android-arm64-v8a
      if: ${{ steps.package-pr-android-arm64-v8a.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ccb-pr-android-arm64-v8a-pr-${{ github.event.pull_request.number }}
        path: ccb-pr-android-arm64-v8a-${{ github.event.pull_request.number }}.apk
        if-no-files-found: error
        retention-days: 14
  #emscripten:
  #  needs: [ skip-duplicates-code, varied_builds ]
  #  uses: ./.github/workflows/emscripten.yml
  #  if: ${{ needs.skip-duplicates-code.outputs.should_skip_code != 'true' && success() && github.event.pull_request.draft == false }}
  #  secrets: inherit

  pr-gate:
    name: PR Gate
    if: always()
    needs: [ skip-duplicates-code, skip-duplicates-data, matrix-variables, build-translations, compile-shaders, varied_builds ]
    permissions:
      contents: none
    runs-on: ubuntu-latest
    steps:
      - name: Summarize component results
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHOULD_SKIP_CODE: ${{ needs.skip-duplicates-code.outputs.should_skip_code }}
          SHOULD_SKIP_DATA: ${{ needs.skip-duplicates-data.outputs.should_skip_data }}
          SKIP_TESTS: ${{ needs.matrix-variables.outputs.skip_tests }}
          RESULT_ROUTE_CODE: ${{ needs.skip-duplicates-code.result }}
          RESULT_ROUTE_DATA: ${{ needs.skip-duplicates-data.result }}
          RESULT_MATRIX_VARIABLES: ${{ needs.matrix-variables.result }}
          RESULT_TRANSLATIONS: ${{ needs.build-translations.result }}
          RESULT_SHADERS: ${{ needs.compile-shaders.result }}
          RESULT_BUILDS: ${{ needs.varied_builds.result }}
        run: |
          failed=0
          {
            echo '## PR Gate'
            echo
            echo '| Component | Result |'
            echo '| --- | --- |'
            echo "| route-code | ${RESULT_ROUTE_CODE} |"
            echo "| route-data | ${RESULT_ROUTE_DATA} |"
            echo "| skip-code | ${SHOULD_SKIP_CODE:-unknown} |"
            echo "| skip-data | ${SHOULD_SKIP_DATA:-unknown} |"
            echo "| broad-tests-skipped | ${SKIP_TESTS:-unknown} |"
            echo "| matrix-variables | ${RESULT_MATRIX_VARIABLES} |"
            echo "| build-translations | ${RESULT_TRANSLATIONS} |"
            echo "| compile-shaders | ${RESULT_SHADERS} |"
            echo "| varied-builds | ${RESULT_BUILDS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$RESULT_ROUTE_CODE" \
            "$RESULT_ROUTE_DATA" \
            "$RESULT_MATRIX_VARIABLES" \
            "$RESULT_TRANSLATIONS" \
            "$RESULT_SHADERS" \
            "$RESULT_BUILDS"; do
            case "$result" in
              success|skipped)
                ;;
              failure|cancelled|*)
                failed=1
                ;;
            esac
          done

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$SHOULD_SKIP_CODE" = "true" ] && [ "$SHOULD_SKIP_DATA" = "true" ]; then
              if [ "$RESULT_TRANSLATIONS" != "skipped" ] || [ "$RESULT_BUILDS" != "skipped" ]; then
                echo 'Irrelevant PR route unexpectedly ran translations or builds.' >&2
                failed=1
              fi
            elif [ "$RESULT_TRANSLATIONS" != "success" ] || [ "$RESULT_BUILDS" != "success" ]; then
              echo 'Relevant PR route did not complete translations and builds.' >&2
              failed=1
            fi
          fi

          if [ "$failed" -ne 0 ]; then
            echo 'One or more PR Gate components failed or were cancelled.' >&2
            exit 1
          fi
