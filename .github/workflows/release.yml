name: "Experimental Release"
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'experimental' }}
  cancel-in-progress: false
on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-translations.yml'
      - '.github/workflows/compose-tilesets.yml'
      - '.github/workflows/release.yml'
      - 'android/**'
      - 'build-data/**'
      - 'build-scripts/generate-release-notes.js'
      - 'cataclysm-launcher'
      - 'data/**'
      - 'doc/**'
      - 'gfx/**'
      - 'lang/po/*.po'
      - 'LICENSE*'
      - 'Makefile'
      - 'README*'
      - 'src/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: experimental
        type: choice
        options:
          - experimental
          - candidate
          - stable
      version:
        description: Base version for Candidate or Stable, for example 0.Ag
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPOSITORY_NAME: ${{ github.event.repository.name }}

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      timestamp: ${{ steps.meta.outputs.time }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Generate release metadata
        id: meta
        env:
          REQUESTED_CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          time=$(TZ=Asia/Shanghai /bin/date "+%Y-%m-%d-%H%M")
          title_time=$(TZ=Asia/Shanghai /bin/date "+%Y-%m-%d_%H:%M")
          channel="experimental"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="${REQUESTED_CHANNEL:-experimental}"
          fi

          case "$channel" in
            experimental)
              tag_name="$time"
              release_name="Experimental $title_time"
              ;;
            candidate|stable)
              if [ -z "${REQUESTED_VERSION:-}" ]; then
                echo "A base version is required for $channel releases." >&2
                exit 1
              fi
              if [[ ! "$REQUESTED_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
                echo "Invalid release version: $REQUESTED_VERSION" >&2
                exit 1
              fi
              if [ "$channel" = "candidate" ]; then
                tag_name="${REQUESTED_VERSION}-Candidate-${time}"
                release_name="${REQUESTED_VERSION} Candidate ${title_time}"
              else
                tag_name="$REQUESTED_VERSION"
                release_name="${REQUESTED_VERSION} Stable"
              fi
              ;;
            *)
              echo "Unsupported release channel: $channel" >&2
              exit 1
              ;;
          esac

          echo "time=$time" >> $GITHUB_OUTPUT
          echo "tag_name=$tag_name" >> $GITHUB_OUTPUT
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "channel=$channel" >> $GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Find previous release tag
        id: previous
        run: |
          previous_tag=$(git describe --tags --abbrev=0 \
            --match '20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9][0-9]' \
            --match 'ccb-experimental-*' HEAD^ 2>/dev/null || true)
          echo "previous_tag=${previous_tag}" >> $GITHUB_OUTPUT
      - name: Generate Release Notes
        run: |
          npm install @actions/github@8
          node build-scripts/generate-release-notes.js '${{ secrets.GITHUB_TOKEN }}' '${{ steps.meta.outputs.tag_name }}' "$(git log -1 --format='%H')" '${{ steps.previous.outputs.previous_tag }}' > notes.txt
      - name: Create GitHub Release
        env:
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_CHANNEL" = "stable" ]; then
            gh release create "$RELEASE_TAG" --notes-file notes.txt --latest \
              --title "$RELEASE_NAME" --target "$(git log -1 --format='%H')"
          else
            gh release create "$RELEASE_TAG" --notes-file notes.txt --prerelease \
              --title "$RELEASE_NAME" --target "$(git log -1 --format='%H')"
          fi

  compose-tilesets:
    uses: ./.github/workflows/compose-tilesets.yml
  build-translations:
    uses: ./.github/workflows/build-translations.yml
    permissions:
      actions: read
      contents: read
    secrets:
      TX_TOKEN: ${{ secrets.TX_TOKEN }}

  # Compile GLSL -> spv/dxil/msl once on Linux and share with every SDL3
  # platform job. Runtime variant_pass picks the format matching its GPU
  # backend (Vulkan/D3D12/Metal). Curses packages do not use the artifact.
  compile-shaders:
    name: Compile shaders
    # Every graphical package uses SDL3; a broken shader toolchain must stop
    # publishing before any package is uploaded.
    runs-on: ubuntu-24.04
    steps:
    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install glslang
      run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

    - name: setup SDL3 (for shadercross link)
      id: sdl
      uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47 # main
      with:
        version: 3.4.10
        cmake-generator: Ninja
        install-linux-dependencies: true

    - name: build SDL_shadercross
      run: |
          git clone --recursive https://github.com/libsdl-org/SDL_shadercross.git /tmp/SDL_shadercross
          cd /tmp/SDL_shadercross
          git checkout 6b06e55c7c5d7e7a09a8a14f76e866dcfad5ab99
          git submodule update --init --recursive
          cmake -P build-scripts/download-prebuilt-DirectXShaderCompiler.cmake
          cmake -S external/SPIRV-Cross -B spirv_cross_build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSPIRV_CROSS_SHARED=OFF \
              -DSPIRV_CROSS_STATIC=ON \
              -DSPIRV_CROSS_CLI=OFF \
              -DSPIRV_CROSS_ENABLE_TESTS=OFF \
              -DCMAKE_INSTALL_PREFIX=/tmp/spirv_cross_prefix
          cmake --build spirv_cross_build
          cmake --install spirv_cross_build
          cmake -B build -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH=/tmp/spirv_cross_prefix \
              -DDirectXShaderCompiler_ROOT=/tmp/SDL_shadercross/external/DirectXShaderCompiler-binaries \
              -DSDLSHADERCROSS_VENDORED=OFF \
              -DSDLSHADERCROSS_INSTALL=ON \
              -DSDLSHADERCROSS_CLI=ON \
              -DSDLSHADERCROSS_SHARED=OFF \
              -DSDLSHADERCROSS_STATIC=ON \
              -DSDLSHADERCROSS_SPIRVCROSS_SHARED=OFF
          cmake --build build
          sudo cmake --install build

    - name: compile shaders for all backends
      env:
        # shadercross dynamically links against SDL3 (built by setup-sdl) and
        # against the prebuilt DXC libdxcompiler.so under the SDL_shadercross
        # external/ tree, neither of which is in the system loader path.
        LD_LIBRARY_PATH: ${{ steps.sdl.outputs.prefix }}/lib:/tmp/SDL_shadercross/external/DirectXShaderCompiler-binaries/linux/lib
      run: |
          python3 tools/build_shaders.py \
              --shader-dir data/shaders \
              --formats spv,dxil,msl \
              --stamp data/shaders/build-spv-dxil-msl.stamp
          touch data/shaders/build-spv.stamp \
                data/shaders/build-dxil.stamp \
                data/shaders/build-msl.stamp

    - name: upload shader artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: cdda-shaders
        path: |
          data/shaders/*.spv
          data/shaders/*.dxil
          data/shaders/*.msl
          data/shaders/build-*.stamp
        if-no-files-found: error
        retention-days: 7

  builds:
    needs:
      - release
      - compose-tilesets
      - build-translations
      - compile-shaders
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Tiles x64 MSVC
            artifact: windows-with-graphics-x64
            arch: x64
            os: windows-2022
            ext: zip
            content: application/zip
            tiles: 1
            sdl3: 1
            sound: 0
          - name: Windows Tiles Sounds x64 MSVC
            artifact: windows-with-graphics-and-sounds-x64
            arch: x64
            os: windows-2022
            ext: zip
            content: application/zip
            tiles: 1
            sdl3: 1
            sound: 1
          - name: Linux Tiles x64
            os: ubuntu-24.04
            android: none
            libbacktrace: 1
            tiles: 1
            sdl3: 1
            sound: 0
            artifact: linux-with-graphics-x64
            ext: tar.gz
            content: application/gzip
          - name: Linux Tiles Sounds x64
            os: ubuntu-24.04
            android: none
            libbacktrace: 1
            tiles: 1
            sdl3: 1
            sound: 1
            artifact: linux-with-graphics-and-sounds-x64
            ext: tar.gz
            content: application/gzip
          - name: Linux Curses x64
            os: ubuntu-24.04
            android: none
            libbacktrace: 1
            tiles: 0
            sound: 0
            artifact: linux-terminal-only-x64
            ext: tar.gz
            content: application/gzip
          - name: macOS Curses Universal Binary (x64 and arm64)
            os: macos-15
            tiles: 0
            sound: 0
            artifact: osx-terminal-only-universal
            ext: dmg
            content: application/x-apple-diskimage
          - name: macOS Tiles Universal Binary (x64 and arm64)
            os: macos-15
            tiles: 1
            sdl3: 1
            sound: 0
            artifact: osx-with-graphics-universal
            ext: dmg
            content: application/x-apple-diskimage
          - name: Android x64
            os: ubuntu-latest
            tiles: 1
            sdl3: 1
            android: arm64
            artifact: android-x64
            ext: apk
            content: application/apk
          - name: Android x64 New UI
            os: ubuntu-latest
            tiles: 1
            sdl3: 1
            android: arm64
            new_ui: 1
            artifact: android-x64-new-ui
            ext: apk
            content: application/apk
          - name: Android x32
            os: ubuntu-latest
            tiles: 1
            sdl3: 1
            android: arm32
            artifact: android-x32
            ext: apk
            content: application/apk 
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: write
    env:
        ZSTD_CLEVEL: 17
        CATA_ENABLE_LUA_PLATFORM: 1
    steps:
      - name: Maximize build space (mac)
        if: ${{ runner.os == 'macos' && matrix.android == '' }}
        run: |
          sudo rm -rf $ANDROID_HOME
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
      - name: Get soundpack
        if: matrix.sound == 1
        run: |
          git clone --depth=1 --shallow-submodules --recurse-submodules https://github.com/Fris0uman/CDDA-Soundpacks '${{ github.workspace }}/CDDA-Soundpacks'
          mv '${{ github.workspace }}/CDDA-Soundpacks/sound/CC-Sounds' '${{ github.workspace }}/data/sound'
      - name: Fetch tileset artifact into build
        if: matrix.tiles == 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tileset-*
          path: gfx
          merge-multiple: true
      - name: Fetch translations artifact into build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: translations
      - name: Verify translations are present
        shell: bash
        run: |
          # Guard against silently shipping an untranslated release: the
          # translations artifact must contain real .po files, not just the
          # committed placeholder. Catches both a failed Transifex pull
          # (placeholder-only artifact) and a failed/empty artifact download.
          count=$(find lang/po -maxdepth 1 -name '*.po' ! -name 'placeholder.po' | wc -l)
          if [ "$count" -eq 0 ]; then
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "::error::No real translations found in lang/po (placeholder only). Refusing to package an untranslated build."
              exit 1
            else
              echo "::warning::No real translations found (TX_TOKEN missing?), building without translations."
            fi
          fi
          echo "Found $count translation .po file(s)."
      - name: Fetch shader artifacts into build (SDL3)
        if: matrix.sdl3 == 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cdda-shaders
          path: data/shaders
      - name: Verify shader artifacts are complete (SDL3)
        if: matrix.sdl3 == 1
        shell: bash
        run: |
          # compile-shaders is continue-on-error so a broken shader toolchain
          # never blocks non-SDL3 releases. But that means a partial/empty
          # artifact can slip through silently and ship a build that crashes
          # at runtime with "failed to read shader artifact". Fail the SDL3
          # build here instead: every .frag/.vert source must have a matching
          # .spv/.dxil/.msl produced by build_shaders.py.
          missing=0
          shopt -s nullglob
          sources=( data/shaders/*.frag data/shaders/*.vert )
          if [ ${#sources[@]} -eq 0 ]; then
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "::error::no shader sources found under data/shaders"
              exit 1
            else
              echo "::warning::no shader sources found, building without precompiled shaders."
            fi
          fi
          for src in "${sources[@]}"; do
            for fmt in spv dxil msl; do
              if [ ! -s "${src}.${fmt}" ]; then
                echo "::error::missing or empty shader artifact: ${src}.${fmt}"
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            if [ "$GITHUB_REF_NAME" = "master" ]; then
              echo "::error::shader artifacts incomplete; the compile-shaders job likely failed silently. Refusing to ship a broken SDL3 build."
              exit 1
            else
              echo "::warning::shader artifacts incomplete, some shader formats missing."
            fi
          fi
          echo "All shader artifacts present for ${#sources[@]} source(s)."
      - name: Mark shader artifacts fresh (SDL3)
        if: matrix.sdl3 == 1
        shell: bash
        run: |
          # Bump artifact mtimes so the Make/CMake shader rule sees them as
          # up-to-date and skips invoking build_shaders.py.
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
      - name: Install dependencies (windows msvc) (1/4)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Install dependencies (windows msvc) (2/4)
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        id: runvcpkg
        with:
          vcpkgDirectory: '${{ github.workspace }}/../b/vcpkg'
          vcpkgGitCommitId: 'f6672d8e480ccdecddfad3fd1b838ba369ffe6cd'
      - name: Install dependencies (windows msvc) (3/4)
        if: runner.os == 'Windows'
        run: |
          vcpkg integrate install --vcpkg-root '${{ github.workspace }}/../b/vcpkg'
      - name: Install dependencies (windows msvc) (4/4)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: mingw64
          install: >-
            gettext
            make
      - name: Cache vcpkg packages (Windows, SDL3)
        if: runner.os == 'Windows' && matrix.sdl3 == 1
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: msvc-full-features/vcpkg_installed
          key: vcpkg-installed-sdl3-${{ hashFiles('msvc-full-features/vcpkg.json', '.github/vcpkg_triplets/x64-windows-static.cmake') }}-f6672d8e480ccdecddfad3fd1b838ba369ffe6cd
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && matrix.android == 'none'
        run: |
          sudo apt-get update
          sudo apt-get install libncursesw5-dev libpulse-dev ccache gettext parallel
      - name: Setup SDL3 stack (Linux)
        if: runner.os == 'Linux' && matrix.android == 'none' && matrix.tiles == 1
        uses: ./.github/actions/setup-sdl3-stack
        with:
          cache-key: sdl3-stack-strict-sdl-3.4.10-image-3.4.4-ttf-3.2.2-mixer-3.2.4-ubuntu-24.04-v2
          prefix: ${{ github.workspace }}/../sdl3_prefix
          stage-licenses: "true"
      - name: Setup universal SDL3 stack (mac)
        if: runner.os == 'macOS' && matrix.tiles == 1
        uses: ./.github/actions/setup-sdl3-stack-macos
        with:
          prefix: ${{ github.workspace }}/../sdl3_prefix
      - name: Install build dependencies (mac)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=yes HOMEBREW_NO_INSTALL_CLEANUP=yes brew install gettext ccache parallel dylibbundler
          pip3 install --break-system-packages dmgbuild biplist
      - name: Create VERSION.TXT
        shell: bash
        run: |
          cat >VERSION.txt <<EOL
          build type: ${{ matrix.artifact }}
          build number: ${NEEDS_RELEASE_OUTPUTS_TIMESTAMP}
          release channel: ${{ needs.release.outputs.channel }}
          release tag: ${{ needs.release.outputs.tag_name }}
          lua api: 1
          commit sha: ${{ github.sha }}
          commit url: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          EOL
        env:
          NEEDS_RELEASE_OUTPUTS_TIMESTAMP: ${{ needs.release.outputs.timestamp }}
      - name: Compile translations (windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          lang/compile_mo.sh all
      - name: Build libbacktrace
        if: matrix.libbacktrace == 1
        run: |
          git clone https://github.com/ianlancetaylor/libbacktrace.git
          cd libbacktrace
          git checkout 14818b7783eeb9a56c3f0fca78cefd3143f8c5f6
          ./configure
          make -j$((`nproc`+0))
          cp LICENSE ${{ github.workspace }}/LICENSE-libbacktrace.txt
          sudo make install
      - name: Build CDDA (linux)
        if: runner.os == 'Linux' && matrix.android == 'none'
        run: |
          if [ "${{ matrix.sdl3 }}" = "1" ]; then
            export PKG_CONFIG_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib/pkgconfig:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu/pkgconfig"
            export LD_LIBRARY_PATH="$RUNNER_WORKSPACE/sdl3_prefix/lib:$RUNNER_WORKSPACE/sdl3_prefix/lib/x86_64-linux-gnu"
          fi
          make COMPILER=clang++-18 -j$((`nproc`+0)) TILES=${{ matrix.tiles }} SOUND=${{ matrix.tiles }} SDL3=${{ matrix.sdl3 == 1 && '1' || '0' }} RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=1 LIBBACKTRACE=${{ matrix.libbacktrace }} WARN_STALE_DATA=1 PCH=0 bindist
          mv cataclysmdda-0.J.tar.gz ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.tar.gz
      - name: Build CDDA (windows msvc, SDL3)
        if: runner.os == 'Windows' && matrix.sdl3 == 1
        env:
          BACKTRACE: 1
          CDDA_RELEASE_BUILD: 1
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\.github\vcpkg_triplets
        run: |
          msbuild -m -p:Configuration=Release -p:Platform=${{ matrix.arch }} -p:UseSDL3=true "-target:Cataclysm-vcpkg-static;JsonFormatter-vcpkg-static;zzip" msvc-full-features\Cataclysm-vcpkg-static.sln
          .\build-scripts\windist.ps1
          mv cataclysmdda-0.J.zip ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.zip
      - name: Build CDDA (osx, curses)
        if: runner.os == 'macOS' && matrix.tiles != 1
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.tiles }} FRAMEWORK=1 SDL3=0 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          mv Cataclysm.dmg ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.dmg
      - name: Build CDDA (osx, SDL3)
        if: runner.os == 'macOS' && matrix.sdl3 == 1
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/../sdl3_prefix/lib/pkgconfig:/opt/local/lib/pkgconfig
          # The MacPorts codecs live in /opt/local/lib; dylibbundler needs it
          # so the mpg123 (and friends) dylibs get pulled into the bundle.
          DYLIBBUNDLER_SEARCH_PATHS: ${{ github.workspace }}/../sdl3_prefix/lib /opt/local/lib
        run: |
          make -j3 TILES=${{ matrix.tiles }} SOUND=${{ matrix.tiles }} SDL3=1 RELEASE=1 LOCALIZE=1 LANGUAGES=all BACKTRACE=0 PCH=0 USE_HOME_DIR=1 UNIVERSAL_BINARY=1 WARN_STALE_DATA=1 dmgdist
          # LGPL gate: mpg123 must ship as a standalone dylib in the bundle so
          # it stays user-replaceable. Empty match means dylibbundler did not
          # bundle it and the build must fail rather than ship a violation.
          if ! ls Cataclysm.app/Contents/Resources/libmpg123*.dylib >/dev/null 2>&1; then
              echo "ERROR: libmpg123 dylib missing from app bundle Resources" >&2
              exit 1
          fi
          mv Cataclysm.dmg ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.dmg
      - name: Set up JDK (android)
        if: runner.os == 'Linux' && matrix.android != 'none'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'   
      - name: Setup Build and Dependencies (android)
        if: runner.os == 'Linux' && matrix.android != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install gettext ccache
      - name: Build CDDA (android)
        if: runner.os == 'Linux' && matrix.android != 'none'
        working-directory: ./android
        run: |
          echo "${{ secrets.KEYSTORE }}" > release.keystore.asc   
          gpg -d --passphrase "${{ secrets.KEYSTORE_PASSWORD }}" --batch release.keystore.asc > app/release.keystore 
          echo "${{ secrets.KEYSTORE_PROPERTIES }}" > keystore.properties.asc   
          gpg -d --passphrase "${{ secrets.KEYSTORE_PASSWORD }}" --batch keystore.properties.asc > keystore.properties
          export UPSTREAM_BUILD_NUMBER="$((11581 + ${{ github.run_number }}))"
          chmod +x gradlew
          if [ "${{ matrix.new_ui }}" = 1 ]
          then
               ./gradlew -Pj=$((`nproc`+0)) -Pabi_arm_32=false -Pprebuilt_shaders=true assembleNewUiRelease
               mv ./app/build/outputs/apk/newUi/release/*.apk ../ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.apk
          elif [ ${{ matrix.android }} = arm64 ]
          then
               ./gradlew -Pj=$((`nproc`+0)) -Pabi_arm_32=false -Pprebuilt_shaders=true assembleExperimentalRelease
               mv ./app/build/outputs/apk/experimental/release/*.apk ../ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.apk
          elif [ ${{ matrix.android }} = arm32 ]
          then
               ./gradlew -Pj=$((`nproc`+0)) -Pabi_arm_64=false -Pprebuilt_shaders=true assembleExperimentalRelease
               mv ./app/build/outputs/apk/experimental/release/*.apk ../ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.apk 
          fi
      - run: |
          gh release upload '${{ needs.release.outputs.tag_name }}' ccb-${{ matrix.artifact }}-${{ needs.release.outputs.timestamp }}.${{ matrix.ext }}
