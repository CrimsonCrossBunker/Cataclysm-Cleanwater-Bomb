name: Lua sol callback teardown microprobe

on:
  push:
    branches:
      - codex/luna-native-gate-lifetime-fix
    paths:
      - .github/workflows/lua-lifetime-diagnostic.yml

permissions:
  contents: read

jobs:
  gcc14-sol-teardown:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the wrapper fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install GCC 14 and record source/compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes g++-14
          mkdir -p diagnostic-logs
          git rev-parse HEAD | tee diagnostic-logs/source.sha
          gcc-14 --version | tee diagnostic-logs/gcc14-c.version
          g++-14 --version | tee diagnostic-logs/gcc14-cxx.version
          printf 'runner=%s\n' "$(lsb_release -ds)" > diagnostic-logs/runner.txt

      - name: Syntax-check the actual Catch regression source
        if: always()
        run: |
          set -uo pipefail
          mkdir -p diagnostic-logs
          command='g++-14 -std=c++17 -DCATA_ENABLE_LUA_PLATFORM=1 -DCATCH_CONFIG_ENABLE_BENCHMARKING -Isrc -Isrc/lua -Itests -fsyntax-only tests/lua_platform_sol_teardown_test.cpp'
          printf '%s\n' "$command" > diagnostic-logs/catch-syntax.command
          if ! command -v g++-14 >/dev/null 2>&1; then
            printf 'syntax_exit=127\nGCC 14 is unavailable.\n' > diagnostic-logs/catch-syntax.exit
            exit 127
          fi
          set +e
          g++-14 -std=c++17 \
            -DCATA_ENABLE_LUA_PLATFORM=1 \
            -DCATCH_CONFIG_ENABLE_BENCHMARKING \
            -Isrc -Isrc/lua -Itests \
            -fsyntax-only tests/lua_platform_sol_teardown_test.cpp \
            > diagnostic-logs/catch-syntax.log 2>&1
          result=$?
          set -e
          printf 'syntax_exit=%s\n' "$result" > diagnostic-logs/catch-syntax.exit
          cat diagnostic-logs/catch-syntax.log
          exit "$result"

      - name: Build bundled Lua and run the actual teardown Catch cases
        if: always()
        run: |
          set -uo pipefail
          mkdir -p diagnostic-logs
          work="${RUNNER_TEMP}/lua-sol-teardown"
          mkdir -p "$work/lua-objects"
          selector='lua_platform_sol_functor_*'
          printf 'selector=%s\ntimeout_seconds=90\nsource=tests/lua_platform_sol_teardown_test.cpp\n' \
            "$selector" > diagnostic-logs/catch-runtime.command
          if ! command -v gcc-14 >/dev/null 2>&1 || ! command -v g++-14 >/dev/null 2>&1; then
            printf 'build_exit=127\nrun_exit=not-run\nGCC 14 is unavailable.\n' > diagnostic-logs/catch-runtime.exit
            exit 127
          fi

          set +e
          for source in src/lua/*.c; do
            object="$work/lua-objects/$(basename "${source%.c}").o"
            gcc-14 -std=c99 -DLUA_USE_DLOPEN -Isrc/lua -c "$source" -o "$object"
            result=$?
            if [[ "$result" -ne 0 ]]; then
              printf 'build_exit=%s\nrun_exit=not-run\nfailed_source=%s\n' \
                "$result" "$source" > diagnostic-logs/catch-runtime.exit
              exit "$result"
            fi
          done

          cat > "$work/catch-main.cpp" <<'CPP'
          #define CATCH_CONFIG_MAIN
          #include "cata_catch.h"
          CPP

          g++-14 -std=c++17 \
            -DCATA_ENABLE_LUA_PLATFORM=1 \
            -DCATCH_CONFIG_ENABLE_BENCHMARKING \
            -Isrc -Isrc/lua -Itests \
            tests/lua_platform_sol_teardown_test.cpp "$work/catch-main.cpp" \
            "$work"/lua-objects/*.o -ldl -lm \
            -o "$work/lua-sol-teardown-tests" \
            > diagnostic-logs/catch-runtime-build.log 2>&1
          build_result=$?
          set -e
          cat diagnostic-logs/catch-runtime-build.log
          if [[ "$build_result" -ne 0 ]]; then
            printf 'build_exit=%s\nrun_exit=not-run\n' "$build_result" > diagnostic-logs/catch-runtime.exit
            exit "$build_result"
          fi
          printf 'build_exit=0\n' > diagnostic-logs/catch-runtime.exit

          set +e
          timeout --signal=TERM --kill-after=5s 90s \
            "$work/lua-sol-teardown-tests" "$selector" \
            --rng-seed 4902 --order lex \
            > diagnostic-logs/catch-runtime.log 2>&1
          run_result=$?
          set -e
          printf 'run_exit=%s\n' "$run_result" >> diagnostic-logs/catch-runtime.exit
          cat diagnostic-logs/catch-runtime.log
          exit "$run_result"

      - name: Upload compiler and teardown probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lua-sol-teardown-gcc14-${{ github.run_id }}
          path: diagnostic-logs/
          if-no-files-found: warn
          retention-days: 14
